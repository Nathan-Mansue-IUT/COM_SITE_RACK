<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Formulaire-Repair Cafe</title>
        <link rel="stylesheet" href="css/style.css">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    </head>
    <body>
        <div class="container my-5">
            <h1 class="mb-2">Rejoindre le Repair Café</h1>
            <p class="text-muted mb-4">Remplissez ce formulaire pour devenir bénévole ou participer à nos ateliers de réparation.</p>

            <form>
                <h5 class="mb-3">Informations personnelles</h5>

                <div class="row mb-3">
                    <div class="col-md-6">
                        <label for="prenom" class="form-label">Prénom <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="prenom" placeholder="Votre prénom" required>
                    </div>
                    <div class="col-md-6">
                        <label for="nom" class="form-label">Nom <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="nom" placeholder="Votre nom" required>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label">Adresse e-mail <span class="text-danger">*</span></label>
                    <input type="email" class="form-control" id="email" placeholder="exemple@mail.com" required>
                </div>

                <div class="mb-3">
                    <label for="telephone" class="form-label">Téléphone</label>
                    <input type="tel" class="form-control" id="telephone" placeholder="06 00 00 00 00">
                </div>

                <div class="mb-3">
                    <label for="ville" class="form-label">Ville <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" id="ville" placeholder="Votre ville" required>
                </div>

                <hr class="my-4">
                <h5 class="mb-3">Votre participation</h5>

                <div class="mb-3">
                    <label class="form-label">Je souhaite participer en tant que <span class="text-danger">*</span></label>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="role" id="benevole" value="benevole">
                        <label class="form-check-label" for="benevole">Bénévole réparateur</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="role" id="visiteur" value="visiteur">
                        <label class="form-check-label" for="visiteur">Visiteur (apporter un objet à réparer)</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="role" id="les-deux" value="les-deux">
                        <label class="form-check-label" for="les-deux">Les deux</label>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Compétences en réparation (si bénévole)</label>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="electronique" value="electronique">
                        <label class="form-check-label" for="electronique">Électronique / Informatique</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="couture" value="couture">
                        <label class="form-check-label" for="couture">Couture / Textile</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="mecanique" value="mecanique">
                        <label class="form-check-label" for="mecanique">Mécanique / Vélo</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="bricolage" value="bricolage">
                        <label class="form-check-label" for="bricolage">Bricolage / Menuiserie</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="autre-competence" value="autre">
                        <label class="form-check-label" for="autre-competence">Autre</label>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="disponibilites" class="form-label">Disponibilités</label>
                    <select class="form-select" id="disponibilites">
                        <option value="" disabled selected>Choisissez vos disponibilités</option>
                        <option value="samedi-matin">Samedi matin</option>
                        <option value="samedi-aprem">Samedi après-midi</option>
                        <option value="dimanche-matin">Dimanche matin</option>
                        <option value="semaine">En semaine</option>
                    </select>
                </div>

                <div class="mb-4">
                    <label for="message" class="form-label">Message ou précisions</label>
                    <textarea class="form-control" id="message" rows="4" placeholder="Décrivez votre motivation, l'objet à réparer, ou toute autre information utile…"></textarea>
                </div>

                <div class="mb-4">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="rgpd" required>
                        <label class="form-check-label" for="rgpd">
                            J'accepte que mes données soient utilisées dans le cadre du Repair Café. <span class="text-danger">*</span>
                        </label>
                    </div>
                     <span class="text-danger">* Champs Obligatoire</span>
                </div>

                <button type="submit" class="btn btn-success">Envoyer ma demande</button>
                <button type="reset" class="btn btn-outline-secondary ms-2">Réinitialiser</button>
            </form>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
